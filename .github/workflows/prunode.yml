name: Prunode Dead Code Check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  prunode-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Code Formatting
        run: npx prettier --check "src/**/*.ts"

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Run Prunode Scan
        # This will fail the PR if dead code is found, thanks to process.exit(1)
        run: npm run scan
