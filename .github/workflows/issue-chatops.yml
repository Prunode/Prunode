name: Issue ChatOps

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    # Only run if the issue is open and the comment starts with /assign
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' && startsWith(github.event.comment.body, '/assign') }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to commenter
        uses: actions/github-script@v7
        with:
          script: |
            const { issue, comment } = context.payload;
            const userLogin = comment.user.login;
            
            // Check if the issue already has assignees
            if (issue.assignees && issue.assignees.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `@${userLogin} This issue is already assigned to someone else. Please find an unassigned issue to contribute to!`
              });
              return;
            }
            
            // Assign the user
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [userLogin]
            });
            
            // React to the user's comment with a rocket!
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              content: 'rocket'
            });
            
            // Add a welcoming comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Awesome! I've assigned this issue to you, @${userLogin}. We look forward to your contribution! 🚀\n\nIf you need any help, feel free to ask questions here.`
            });
